<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Past Exam Library — Blessed G/Michael Catholic Secondary School</title>
    <meta name="description" content="A student-run archive of authentic past examination papers and interactive practice for Blessed G/Michael Catholic Secondary School.">
    <meta name="theme-color" content="#4f46e5">

    <!-- Progressive Web App (PWA) Manifest & Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Exam Library">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="site-header">
        <div class="header-left">
            <div class="logo" onclick="navigateToHome()" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); navigateToHome(); }" role="button" tabindex="0" aria-label="Past Exam Library home">
                <span class="brand-mark" aria-hidden="true">P</span>
                <span>Past Exam <span class="logo-accent">Library</span></span>
            </div>
            <div class="header-tagline">A student-run archive</div>
        </div>

        <div id="header-nav" class="header-nav">
            <!-- Rendered dynamically by script.js -->
        </div>
    </header>

    <main id="main-container">
        <!-- Rendered dynamically (Login / Admin Dashboard / Library) -->
        <div id="app"></div>
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Global Modal Container -->
    <div id="modal-container" class="modal-backdrop" style="display: none;"></div>

    <footer>
        <div class="footer-content">
            <div>
                <strong>Past Exam Library</strong><span>Student resource & examination papers</span>
            </div>
            <div>
                Created by Soliyana Tewodros, Nahom Temesgen & Kidus Yahunsew
            </div>
            <div>
                Made for the next class, by the last one.
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
