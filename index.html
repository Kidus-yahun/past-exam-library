<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Past exam papers and practice questions for Ethiopian Grade 9–12 students." />
    <title>Past Exam Library</title>
    <script>
      // Apply the theme before first paint so there is no light flash in dark mode.
      // Keep in sync with src/lib/theme.ts (storage key and values).
      (() => {
        var pref = "system";
        try { pref = localStorage.getItem("pel-theme") || "system"; } catch {}
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
