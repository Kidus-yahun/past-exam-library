<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Past Exam Library & Admin Portal</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Ambient Animated Mesh Glow Background -->
    <div class="ambient-glow-wrapper" aria-hidden="true">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <header id="site-header">
        <div class="header-left">
            <div class="logo" onclick="navigateToHome()" style="cursor: pointer;">
                PastExam<span class="logo-accent">Library</span>
            </div>
            <div class="header-tagline">Academic Resource Portal</div>
        </div>

        <div id="header-nav" class="header-nav">
            <!-- Rendered dynamically by script.js -->
        </div>
    </header>

    <main id="main-container">
        <!-- Rendered dynamically (Login / Admin Dashboard / Library) -->
        <div id="app"></div>
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Global Modal Container -->
    <div id="modal-container" class="modal-backdrop" style="display: none;"></div>

    <footer>
        <div class="footer-content">
            <div>
                <strong>Past Exam Library</strong> • Student Resource & Examination Portal
            </div>
            <div>
                Created by Soliyana Tewodros, Nahom Temesgen & Kidus Yahunsew
            </div>
            <div>
                Built for students, by students.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
